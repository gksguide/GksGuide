<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up</title>
<link rel="stylesheet" href="auth.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<div class="auth-box">
    <h1>Sign up</h1>
    <p class="auth-subtitle">Create your account</p>
<div style="background:#fff3cd; border:1px solid #ffe69c; padding:10px 15px; border-radius:8px; font-size:13px; margin-bottom:15px; line-height:2;">
    ⚠️ If your IP address is in Iran, please change it to a US IP address using a <strong>VPN</strong>.
</div>
    <div id="error-msg" style="display:none; background:#ffe0e0; color:#c00; padding:10px; border-radius:8px; margin-bottom:15px; font-size:13px;"></div>
    <div id="success-msg" style="display:none; background:#e0ffe0; color:#080; padding:10px; border-radius:8px; margin-bottom:15px; font-size:13px;"></div>

    <div class="input-group">
        <i class="fas fa-user"></i>
        <input type="text" id="name" placeholder="Full name">
    </div>
    <div class="input-group">
        <i class="fas fa-envelope"></i>
        <input type="email" id="email" placeholder="Email">
    </div>
    <div class="input-group">
        <i class="fas fa-lock"></i>
        <input type="password" id="password" placeholder="Password (at least 6 characters)">
    </div>
    <div class="input-group">
        <i class="fas fa-lock"></i>
        <input type="password" id="password2" placeholder="Confirm password">
    </div>

    <button id="register-btn">Create account</button>
    <p>Already have an account? <a href="login-email.html">Sign in</a></p>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script>
window.onload = function() {

const firebaseConfig = {
    apiKey: "AIzaSyDQmdz3v9qFMiRmq9ftdx5AG684QKjWeHQ",
    authDomain: "gksguide1-e7464.firebaseapp.com",
    projectId: "gksguide1-e7464",
    storageBucket: "gksguide1-e7464.firebasestorage.app",
    messagingSenderId: "935501118637",
    appId: "1:935501118637:web:bad899f43f835d2e1c9a24"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

document.getElementById('register-btn').addEventListener('click', async function() {
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const password2 = document.getElementById('password2').value;
    const errorMsg = document.getElementById('error-msg');
    const successMsg = document.getElementById('success-msg');
    const btn = document.getElementById('register-btn');

    errorMsg.style.display = 'none';
    successMsg.style.display = 'none';

    if (!name || !email || !password || !password2) {
        errorMsg.textContent = 'Please fill in all fields.';
        errorMsg.style.display = 'block';
        return;
    }
    if (password !== password2) {
        errorMsg.textContent = 'The passwords do not match.';
        errorMsg.style.display = 'block';
        return;
    }
    if (password.length < 6) {
        errorMsg.textContent = 'Password must be at least 6 characters.';
        errorMsg.style.display = 'block';
        return;
    }

    btn.textContent = 'Creating account...';
    btn.disabled = true;

    try {
        const userCredential = await auth.createUserWithEmailAndPassword(email, password);
        await userCredential.user.updateProfile({ displayName: name });
        successMsg.textContent = 'Registration successful! Redirecting...';
        successMsg.style.display = 'block';
        setTimeout(() => window.location.href = 'index.html', 1500);
    } catch (error) {
        let msg = 'An error occurred: ' + error.message;
        if (error.code === 'auth/email-already-in-use') msg = 'This email is already registered.';
        if (error.code === 'auth/invalid-email') msg = 'Invalid email format.';
        if (error.code === 'auth/weak-password') msg = 'The password is too weak.';
        errorMsg.textContent = msg;
        errorMsg.style.display = 'block';
        btn.textContent = 'Create account';
        btn.disabled = false;
    }
});
}
</script>

</body>
</html>
