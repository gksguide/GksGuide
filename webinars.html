<script>
window.onload = function() {
    const firebaseConfig = {
        apiKey: "AIzaSyDQmdz3v9qFMiRmq9ftdx5AG684QKjWeHQ",
        authDomain: "gksguide1-e7464.firebaseapp.com",
        projectId: "gksguide1-e7464",

        appId: "1:935501118637:web:bad899f43f835d2e1c9a24"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const container = document.querySelector('.webinar-container');

    db.collection('webinars').orderBy('createdAt', 'desc').get().then(function(snapshot) {
        snapshot.forEach(function(doc) {
            const d = doc.data();
            const card = document.createElement('div');
            card.className = 'webinar-card';
            card.innerHTML = `
                <div class="webinar-content">
                    <h3>${d.title}</h3>
                    <p>تاریخ برگزاری: ${d.date || ''}</p>
                    <a href="webinar-view.html?id=${doc.id}">مشاهده وبینار</a>
                </div>
            `;
            container.appendChild(card);
        });
    }).catch(function(e) {
        console.error('خطا در بارگذاری وبینارهای پنل:', e);
    });
}
</script>
