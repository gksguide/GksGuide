<script>
window.onload = function() {
    const firebaseConfig = {
        apiKey: "AIzaSyDQmdz3v9qFMiRmq9ftdx5AG684QKjWeHQ",
        authDomain: "gksguide1-e7464.firebaseapp.com",
        projectId: "gksguide1-e7464",
        storageBucket: "gksguide1-e7464.firebasestorage.app",
        messagingSenderId: "935501118637",
        appId: "1:935501118637:web:bad899f43f835d2e1c9a24"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const container = document.querySelector('.webinar-container');

    db.collection('webinars').orderBy('createdAt', 'desc').get().then(function(snapshot) {
        snapshot.forEach(function(doc) {
            const d = doc.data();
            const card = document.createElement('div');
            card.className = 'webinar-card';
            const imgHtml = d.image
                ? `<img src="${d.image}" alt="${d.title}">`
                : `<div style="width:100%; height:200px; background:linear-gradient(135deg, #fdeef3 0%, #eafaf1 100%); display:flex; align-items:center; justify-content:center;"><i class="fas fa-video" style="font-size:34px; color:#c2487a;"></i></div>`;
            card.innerHTML = `
                ${imgHtml}
                <div class="webinar-content">
                    <h3>${d.title}</h3>
                    <p>Date: ${d.date || ''}</p>
                    <a href="webinar-view.html?id=${doc.id}">Watch webinar</a>
                </div>
            `;
            container.appendChild(card);
        });
    }).catch(function(e) {
        console.error('Error loading panel webinars:', e);
    });
}
</script>
</body>
