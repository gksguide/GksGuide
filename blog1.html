<script> 
window.onload = function() { 
    const firebaseConfig = { 
        apiKey: "AIzaSyDQmdz3v9qFMiRmq9ftdx5AG684QKjWeHQ", 
        authDomain: "gksguide1-e7464.firebaseapp.com", 
        projectId: "gksguide1-e7464", 
        storageBucket: "gksguide1-e7464.firebasestorage.app", 
        messagingSenderId: "935501118637", 
        appId: "1:935501118637:web:bad899f43f835d2e1c9a24" 
    }; 
 
    firebase.initializeApp(firebaseConfig); 
    const auth = firebase.auth(); 
    const db = firebase.firestore(); 
    const commentsRef = db.collection('comments').doc('blog1').collection('items'); 
 
    auth.onAuthStateChanged(function(user) { 
        if (user) { 
            document.getElementById('login-warning').style.display = 'none'; 
            document.getElementById('comment-form').style.display = 'block'; 
            document.getElementById('commenter-name').textContent = user.displayName || user.email; 
        } else { 
            document.getElementById('login-warning').style.display = 'block'; 
            document.getElementById('comment-form').style.display = 'none'; 
        } 
    }); 
 
    commentsRef.orderBy('timestamp', 'desc').onSnapshot(function(snapshot) { 
        document.getElementById('loading-comments').style.display = 'none'; 
        const list = document.getElementById('comments-list'); 
        list.innerHTML = ''; 
 
        if (snapshot.empty) { 
            list.innerHTML = '<div style="text-align:center; color:#999; padding:20px;">هنوز نظری ثبت نشده است.</div>'; 
            return; 
        } 
 
        snapshot.forEach(function(doc) { 
            const data = doc.data(); 
            const div = document.createElement('div'); 
            div.className = 'comment'; 
            div.innerHTML =`
                <div class="comment-user"><strong>${data.name}</strong> <span style="font-size:11px; color:#999;">${data.time || ''}</span></div> 
                <div class="comment-text">${data.text}</div> 
            `; 
            list.appendChild(div); 
        }); 
    }); 
 
    window.submitComment = async function() { 
        const text = document.getElementById('comment-text').value.trim(); 
        const user = auth.currentUser; 
        if (!text || !user) return; 
 
        const btn = document.querySelector('#comment-form button'); 
        btn.textContent = 'در حال ارسال...'; 
        btn.disabled = true; 
 
        try { 
            await commentsRef.add({ 
                name: user.displayName || user.email, 
                text: text, 
                timestamp: firebase.firestore.FieldValue.serverTimestamp(), 
                time: new Date().toLocaleDateString('fa-IR') 
            }); 
            document.getElementById('comment-text').value = ''; 
        } catch (e) { 
            alert('خطا در ارسال نظر. لطفاً دوباره تلاش کنید.'); 
        } 
 
        btn.innerHTML = '<i class="fas fa-paper-plane"></i> ثبت نظر'; 
        btn.disabled = false; 
    } 
} 
</script>
