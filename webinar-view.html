<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Webinar</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="webinars.css">
</head>
<body>
<a href="webinars.html" class="back-btn">
<i class="fas fa-arrow-left"></i> Back to Webinars
</a>
<div class="container">
    <h1 id="w-title">Loading...</h1>
    <img id="w-image" src="" alt="" style="display:none; width:100%; border-radius:10px; margin-bottom:15px; max-height:360px; object-fit:cover;">
    <div class="video" style="position:relative; width:100%; padding-bottom:56.25%; height:0; overflow:hidden; border-radius:10px;">
        <iframe id="w-frame" src="" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen style="position:absolute; top:0; left:0; width:100%; height:100%; border:none;"></iframe>
    </div>
    <div class="description">
        <h3>Webinar description</h3>
        <p id="w-desc"></p>
    </div>
</div>
<div class="comments-section">
    <h2>User comments</h2>
    <div id="login-warning" class="login-warning">
        You need to sign in to post a comment.
        <br><br>
        <a href="login-email.html">Sign in</a> &nbsp;|&nbsp; <a href="register.html">Sign up</a>
    </div>
    <div id="comment-form" style="display:none; margin-bottom:25px;">
        <div style="background:#fdeef3; padding:15px; border-radius:12px; margin-bottom:15px;">
            <span style="font-size:13px; color:#c2487a;"><i class="fas fa-user-circle"></i> Posting as: </span>
            <strong id="commenter-name" style="color:#c2487a;"></strong>
        </div>
        <textarea id="comment-text" placeholder="Write your comment..." style="width:100%; min-height:100px; padding:12px; border:1px solid #ddd; border-radius:10px; font-family:Inter,Arial, sans-serif; font-size:14px; resize:vertical;"></textarea>
        <button onclick="submitComment()" style="margin-top:10px; padding:10px 20px; background:#c2487a; color:white; border:none; border-radius:8px; cursor:pointer; font-family:Inter,Arial, sans-serif; font-size:14px;">
            <i class="fas fa-paper-plane"></i> Post comment
        </button>
        <p style="font-size:11px; color:#888; margin-top:6px;">Your comment will be visible to others after admin approval.</p>
    </div>
    <div id="comments-list">
        <div style="text-align:center; color:#666; padding:20px;" id="loading-comments">
            <i class="fas fa-spinner fa-spin"></i> Loading comments...
        </div>
    </div>
</div>
<a href="https://t.me/kgsp_iran" target="_blank" class="float-telegram">
    <i class="fab fa-telegram"></i>
</a>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
window.onload = function() {
    const firebaseConfig = {
        apiKey: "AIzaSyDQmdz3v9qFMiRmq9ftdx5AG684QKjWeHQ",
        authDomain: "gksguide1-e7464.firebaseapp.com",
        projectId: "gksguide1-e7464",
        storageBucket: "gksguide1-e7464.firebasestorage.app",
        messagingSenderId: "935501118637",
        appId: "1:935501118637:web:bad899f43f835d2e1c9a24"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const params = new URLSearchParams(window.location.search);
    const webinarId = params.get('id');
    if (!webinarId) {
        document.getElementById('w-title').textContent = 'Webinar not found.';
    } else {
        db.collection('webinars').doc(webinarId).get().then(function(doc) {
            if (!doc.exists) {
                document.getElementById('w-title').textContent = 'Webinar not found.';
                return;
            }
            const d = doc.data();
            document.title = d.title;
            document.getElementById('w-title').textContent = d.title;
            document.getElementById('w-desc').textContent = d.description || '';
            if (d.image) {
                const imgEl = document.getElementById('w-image');
                imgEl.src = d.image;
                imgEl.alt = d.title;
                imgEl.style.display = 'block';
            }
            document.getElementById('w-frame').src = getEmbedUrl(d.link || '');
        });
    }

    function getEmbedUrl(link) {
        if (!link) return '';
        const ytMatch = link.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([a-zA-Z0-9_-]{11})/);
        if (ytMatch) {
            return 'https://www.youtube.com/embed/' + ytMatch[1];
        }
        const driveMatch = link.match(/\/d\/([^/]+)/);
        if (driveMatch) {
            return 'https://drive.google.com/file/d/' + driveMatch[1] + '/preview';
        }
        return link;
    }

    const commentsRef = db.collection('comments').doc('webinar-view-' + webinarId).collection('items');
    let lastSnapshot = null;

    auth.onAuthStateChanged(function(user) {
        if (user) {
            document.getElementById('login-warning').style.display = 'none';
            document.getElementById('comment-form').style.display = 'block';
            document.getElementById('commenter-name').textContent = user.displayName || user.email;
        } else {
            document.getElementById('login-warning').style.display = 'block';
            document.getElementById('comment-form').style.display = 'none';
        }
        if (lastSnapshot) renderComments(lastSnapshot);
    });

    commentsRef.orderBy('timestamp', 'desc').onSnapshot(function(snapshot) {
        lastSnapshot = snapshot;
        renderComments(snapshot);
    });

    function renderComments(snapshot) {
        document.getElementById('loading-comments').style.display = 'none';
        const list = document.getElementById('comments-list');
        list.innerHTML = '';
        const currentUser = auth.currentUser;
        let shown = 0;

        snapshot.forEach(function(doc) {
            const data = doc.data();
            const commentId = doc.id;
            const isApproved = data.approved !== false;
            const isOwner = currentUser && data.uid === currentUser.uid;
            if (!isApproved && !isOwner) return;
            shown++;

            const div = document.createElement('div');
            div.className = 'comment';

            let ownerButtons = '';
            if (isOwner) {
                ownerButtons = `
                    <div style="margin-top:8px; display:flex; gap:12px;">
                        <button onclick="deleteComment('${commentId}')" style="background:none; border:none; color:#c00; font-size:12px; cursor:pointer; font-family:Inter,Arial, sans-serif; padding:0;">
                            <i class="fas fa-trash"></i> Delete
                        </button>
                    </div>
                `;
            }
            const pendingTag = !isApproved ? '<span style="font-size:10px; color:#c98a00;"> (Pending approval — only you can see this)</span>' : '';
            const replyHtml = data.adminReply ? `<div class="admin-reply"><strong>Admin reply <i class="fas fa-circle-check" style="color:#1d9bf0; font-size:11px;"></i>:</strong><br>${data.adminReply}</div>` : '';

            div.innerHTML = `
                <div class="comment-user"><strong>${data.name}</strong>${data.isAdminComment ? ' <i class="fas fa-circle-check" title="Site admin" style="color:#1d9bf0; font-size:12px;"></i>' : ''} <span style="font-size:11px; color:#666;">${data.time || ''}</span>${pendingTag}</div>
                <div class="comment-text">${data.text}</div>
                ${replyHtml}
                ${ownerButtons}
            `;
            list.appendChild(div);
        });

        if (shown === 0) {
            list.innerHTML = '<div style="text-align:center; color:#666; padding:20px;">No comments yet.</div>';
        }
    }

    window.deleteComment = async function(commentId) {
        if (!confirm('Are you sure you want to delete this comment?')) return;
        try {
            await commentsRef.doc(commentId).delete();
        } catch (e) {
            alert('Error deleting comment: ' + e.message);
        }
    }

    window.submitComment = async function() {
        const text = document.getElementById('comment-text').value.trim();
        const user = auth.currentUser;
        if (!text || !user) return;
        const btn = document.querySelector('#comment-form button');
        btn.textContent = 'Sending...';
        btn.disabled = true;
        try {
            const adminDoc = await db.collection('admins').doc(user.uid).get();
            const isAdminUser = adminDoc.exists;
            await commentsRef.add({
                uid: user.uid,
                name: user.displayName || user.email,
                text: text,
                approved: isAdminUser ? true : false,
                isAdminComment: isAdminUser,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                time: new Date().toLocaleDateString('en-US')
            });
            document.getElementById('comment-text').value = '';
        } catch (e) {
            alert('Error posting comment: ' + e.message);
        }
        btn.innerHTML = '<i class="fas fa-paper-plane"></i> Post comment';
        btn.disabled = false;
    }
}
</script>
</body>
</html>
