<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in</title>
<link rel="stylesheet" href="auth.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<div class="auth-box">
    <h1>Sign in</h1>
    <p class="auth-subtitle">Welcome back!</p>
<div style="background:#fff3cd; border:1px solid #ffe69c; padding:10px 15px; border-radius:8px; font-size:13px; margin-bottom:15px; line-height:2;">
    ⚠️ If your IP address is in Iran, please change it to a US IP address using a <strong>VPN</strong>.
</div>
    <div id="error-msg" style="display:none; background:#ffe0e0; color:#c00; padding:10px; border-radius:8px; margin-bottom:15px; font-size:13px;"></div>
    <div id="success-msg" style="display:none; background:#e0ffe0; color:#080; padding:10px; border-radius:8px; margin-bottom:15px; font-size:13px; line-height:1.9;"></div>

    <div class="input-group">
        <i class="fas fa-envelope"></i>
        <input type="email" id="email" placeholder="Email">
    </div>
    <div id="login-fields">
        <div class="input-group">
            <i class="fas fa-lock"></i>
            <input type="password" id="password" placeholder="Password">
        </div>

        <p style="text-align:right; margin:-8px 0 15px;">
            <a href="#" id="forgot-link" style="font-size:12px; color:#c2487a; text-decoration:underline;">Forgot your password?</a>
        </p>

        <button id="login-btn">Sign in</button>
    </div>

    <div id="reset-fields" style="display:none;">
        <p style="font-size:13px; color:#444; line-height:2; margin-bottom:15px;">
            Enter the email you registered with above and we will send you a password reset link.
        </p>
        <button id="reset-btn">Send reset link</button>
        <p><a href="#" id="back-to-login" style="font-size:13px;">Back to sign in</a></p>
    </div>

    <p id="register-link">Don't have an account? <a href="register.html">Sign up</a></p>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script>
window.onload = function() {

const firebaseConfig = {
    apiKey: "AIzaSyDQmdz3v9qFMiRmq9ftdx5AG684QKjWeHQ",
    authDomain: "gksguide1-e7464.firebaseapp.com",
    projectId: "gksguide1-e7464",
    storageBucket: "gksguide1-e7464.firebasestorage.app",
    messagingSenderId: "935501118637",
    appId: "1:935501118637:web:bad899f43f835d2e1c9a24"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

document.getElementById('login-btn').addEventListener('click', async function() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errorMsg = document.getElementById('error-msg');
    const successMsg = document.getElementById('success-msg');
    const btn = document.getElementById('login-btn');

    errorMsg.style.display = 'none';
    successMsg.style.display = 'none';

    if (!email || !password) {
        errorMsg.textContent = 'Please enter your email and password.';
        errorMsg.style.display = 'block';
        return;
    }

    btn.textContent = 'Signing in...';
    btn.disabled = true;

    try {
        await auth.signInWithEmailAndPassword(email, password);
        const params = new URLSearchParams(window.location.search);
        const redirectTo = params.get('redirect') || 'index.html';
        window.location.href = redirectTo;
    } catch (error) {
        let msg = 'An error occurred: ' + error.message;
        if (error.code === 'auth/user-not-found') msg = 'No account exists with this email.';
        if (error.code === 'auth/wrong-password') msg = 'Incorrect password.';
        if (error.code === 'auth/invalid-email') msg = 'Invalid email format.';
        if (error.code === 'auth/too-many-requests') msg = 'Too many attempts. Please wait a moment.';
        if (error.code === 'auth/invalid-credential') msg = 'Incorrect email or password.';
        errorMsg.textContent = msg;
        errorMsg.style.display = 'block';
        btn.textContent = 'Sign in';
        btn.disabled = false;
    }
});

const loginFields = document.getElementById('login-fields');
const resetFields = document.getElementById('reset-fields');
const registerLink = document.getElementById('register-link');
const authTitle = document.querySelector('.auth-box h1');
const authSubtitle = document.querySelector('.auth-subtitle');
const errorMsg = document.getElementById('error-msg');
const successMsg = document.getElementById('success-msg');

document.getElementById('forgot-link').addEventListener('click', function(e) {
    e.preventDefault();
    loginFields.style.display = 'none';
    registerLink.style.display = 'none';
    resetFields.style.display = 'block';
    authTitle.textContent = 'Reset password';
    authSubtitle.textContent = 'Enter your email to receive a reset link';
    errorMsg.style.display = 'none';
    successMsg.style.display = 'none';
});

document.getElementById('back-to-login').addEventListener('click', function(e) {
    e.preventDefault();
    resetFields.style.display = 'none';
    loginFields.style.display = 'block';
    registerLink.style.display = 'block';
    authTitle.textContent = 'Sign in';
    authSubtitle.textContent = 'Welcome back!';
    errorMsg.style.display = 'none';
    successMsg.style.display = 'none';
});

document.getElementById('reset-btn').addEventListener('click', async function() {
    const email = document.getElementById('email').value.trim();
    const resetBtn = document.getElementById('reset-btn');

    errorMsg.style.display = 'none';
    successMsg.style.display = 'none';

    if (!email) {
        errorMsg.textContent = 'Please enter your email.';
        errorMsg.style.display = 'block';
        return;
    }

    resetBtn.textContent = 'Sending...';
    resetBtn.disabled = true;

    try {
        await auth.sendPasswordResetEmail(email);
        successMsg.textContent = 'A password reset link was sent to ' + email + '. Check your inbox (and spam folder).';
        successMsg.style.display = 'block';
    } catch (error) {
        let msg = 'An error occurred: ' + error.message;
        if (error.code === 'auth/user-not-found') msg = 'No account exists with this email.';
        if (error.code === 'auth/invalid-email') msg = 'Invalid email format.';
        if (error.code === 'auth/too-many-requests') msg = 'Too many attempts. Please try again later.';
        errorMsg.textContent = msg;
        errorMsg.style.display = 'block';
    }

    resetBtn.textContent = 'Send reset link';
    resetBtn.disabled = false;
});
}
</script>

</body>
</html>
