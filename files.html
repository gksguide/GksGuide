<script>
window.onload = function() {
    const firebaseConfig = {
        apiKey: "AIzaSyDQmdz3v9qFMiRmq9ftdx5AG684QKjWeHQ",
        authDomain: "gksguide1-e7464.firebaseapp.com",
        projectId: "gksguide1-e7464",
        storageBucket: "gksguide1-e7464.firebasestorage.app",
        messagingSenderId: "935501118637",
        appId: "1:935501118637:web:bad899f43f835d2e1c9a24"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const container = document.querySelector('.files-container');

    db.collection('useful_files').orderBy('createdAt', 'desc').get().then(function(snapshot) {
        snapshot.forEach(function(doc) {
            const d = doc.data();
            const card = document.createElement('div');
            card.className = 'file-card';
            card.innerHTML = `
                <h3>${d.title}</h3>
                <p>${d.description || ''}</p>
                <a href="${d.link}" target="_blank" class="file-btn">مشاهده فایل</a>
            `;
            container.appendChild(card);
        });
    }).catch(function(e) {
        console.error('خطا در بارگذاری فایل‌های پنل:', e);
    });
}
</script>
</body> 
</html>
